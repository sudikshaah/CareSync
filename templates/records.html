{% extends 'base.html' %}
{% block content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Medical Records</h1>
    <button onclick="openModal('addRecordModal')" class="bg-primary text-white px-4 py-2 rounded-xl shadow-soft font-semibold hover:bg-blue-600 transition">+ Add Record</button>
</div>

<div class="bg-surface shadow-soft rounded-xl overflow-x-auto">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Patient</th>
                <th>Date</th>
                <th>Diagnosis</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            {% for r in records %}
            <tr>
                <td>#{{ r.id }}</td>
                <td class="font-medium">{{ r.patient.name }}</td>
                <td>{{ r.date }}</td>
                <td class="font-semibold text-primary">{{ r.diagnosis }}</td>
                <td class="text-sm text-gray-600 truncate max-w-xs" title="{{ r.notes }}">{{ r.notes }}</td>
            </tr>
            {% else %}
            <tr><td colspan="5" class="text-center py-8 text-gray-500">No medical records found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<!-- Add Modal -->
<div id="addRecordModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center">
    <div class="bg-surface w-full max-w-lg p-6 rounded-xl shadow-xl">
        <h2 class="text-xl font-bold mb-4">Add Medical Record</h2>
        <form method="POST" action="{{ url_for('records') }}">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Patient</label>
                    <select name="patient_id" class="w-full px-3 py-2 border border-[#E0E0E0] rounded-xl" required>
                        <option value="">-- Select Patient --</option>
                        {% for p in patients %}
                        <option value="{{ p.id }}">{{ p.name }} ({{ p.contact }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div><label class="block text-sm font-medium mb-1">Diagnosis</label><input type="text" name="diagnosis" class="w-full px-3 py-2 border border-[#E0E0E0] rounded-xl" required></div>
                <div><label class="block text-sm font-medium mb-1">Notes</label><textarea name="notes" rows="4" class="w-full px-3 py-2 border border-[#E0E0E0] rounded-xl"></textarea></div>
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button type="button" onclick="closeModal('addRecordModal')" class="px-4 py-2 border border-[#E0E0E0] rounded-xl text-gray-600 hover:bg-gray-100 font-medium">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-primary text-white rounded-xl font-medium hover:bg-blue-600">Save Record</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
