{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-surface rounded-xl shadow-soft p-6 border border-[#E0E0E0]">
        <h1 class="text-2xl font-bold mb-6 border-b pb-4">Generate Bill - Appointment #{{ appointment.id }}</h1>
        
        <div class="mb-6 bg-gray-50 p-4 rounded-xl border border-[#E0E0E0]">
            <h3 class="font-bold text-lg mb-2">Patient Information</h3>
            <p><strong>Name:</strong> {{ appointment.patient.name }}</p>
            <p><strong>Doctor:</strong> Dr. {{ appointment.doctor.name }}</p>
            <p><strong>Date:</strong> {{ appointment.date }}</p>
        </div>

        <form method="POST" action="{{ url_for('billing', appointment_id=appointment.id) }}" class="space-y-4">
            <div class="flex items-center justify-between">
                <label class="font-medium text-gray-700">Consultation Fee (₹)</label>
                <input type="number" step="0.01" name="consultation_fee" id="consultation" value="{{ bill.consultation_fee if bill else 0 }}" class="w-32 px-3 py-2 border border-[#E0E0E0] rounded-xl text-right calc-input">
            </div>
            <div class="flex items-center justify-between">
                <label class="font-medium text-gray-700">Medicine Cost (₹)</label>
                <input type="number" step="0.01" name="medicine_cost" id="medicine" value="{{ bill.medicine_cost if bill else 0 }}" class="w-32 px-3 py-2 border border-[#E0E0E0] rounded-xl text-right calc-input">
            </div>
            <div class="flex items-center justify-between">
                <label class="font-medium text-gray-700">Test Cost (₹)</label>
                <input type="number" step="0.01" name="test_cost" id="test" value="{{ bill.test_cost if bill else 0 }}" class="w-32 px-3 py-2 border border-[#E0E0E0] rounded-xl text-right calc-input">
            </div>
            
            <div class="border-t border-[#E0E0E0] pt-4 mt-6 flex items-center justify-between">
                <span class="text-xl font-bold">Total (₹)</span>
                <span class="text-2xl font-bold text-primary" id="totalDisplay">0.00</span>
            </div>

            <div class="mt-8 flex justify-end space-x-4">
                <a href="{{ url_for('appointments') }}" class="px-6 py-2 border border-[#E0E0E0] rounded-xl text-gray-600 hover:bg-gray-100 font-medium">Back</a>
                <button type="submit" class="px-6 py-2 bg-secondary text-white rounded-xl font-bold hover:bg-green-600 transition">Save & Print Bill</button>
            </div>
        </form>
    </div>
</div>

<script>
    const inputs = document.querySelectorAll('.calc-input');
    const totalDisplay = document.getElementById('totalDisplay');

    function calculateTotal() {
        let total = 0;
        inputs.forEach(input => {
            total += parseFloat(input.value) || 0;
        });
        totalDisplay.innerText = total.toFixed(2);
    }

    inputs.forEach(input => {
        input.addEventListener('input', calculateTotal);
    });
    
    // Initial calc
    calculateTotal();
</script>
{% endblock %}
